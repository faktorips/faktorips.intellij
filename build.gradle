import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType

plugins {
    id 'org.jetbrains.intellij.platform' version '2.19.0'
    id 'java'
}

group 'org.faktorips'
// version is in gradle.properties file, for easy automated access

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity '2022.3'
        bundledPlugin 'com.intellij.java'

        pluginVerifier()
        zipSigner()
    }
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.4'
}

intellijPlatform {
    buildSearchableOptions = false
    instrumentCode = true
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '223'
            untilBuild = provider { null } as Provider<? extends String>
        }
    }
    pluginVerification {
        ides {
            recommended()
        }
    }
    patchPluginXml {
        changeNotes = """
        Alpha Version
        """.stripIndent()
    }
    signing {
        certificateChain = System.getenv('INTELLIJ_CERTIFICATE_CHAIN')!=null?new File(System.getenv('INTELLIJ_CERTIFICATE_CHAIN')).getText('UTF-8'):''
        privateKey = System.getenv('INTELLIJ_PRIVATE_KEY')!=null?new File(System.getenv('INTELLIJ_PRIVATE_KEY')).getText('UTF-8'):''
        password = System.getenv('INTELLIJ_PRIVATE_KEY_PASSWORD')?:''
    }
    publishing {
        token = System.getenv('INTELLIJ_PUBLISH_TOKEN')?:''
        channels = [System.getenv('INTELLIJ_CHANNEL')?:'Alpha']
    }
}
// runIde needs at least IDE 2023.3, so the sandbox for manual testing uses a newer IDE than the 2022.3 build target
intellijPlatformTesting {
    runIde {
        register('runIdeRecent') {
            type = IntelliJPlatformType.IntellijIdeaCommunity
            version = '2024.3'
        }
    }
}

test {
    useJUnitPlatform()
}
